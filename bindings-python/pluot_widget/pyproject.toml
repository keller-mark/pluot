[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pluot_widget"
version = "0.1.19"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
  {name = "Mark Keller"}
]
readme = "README.md"
description = "AnyWidget for rendering Pluot visualizations client-side via WebAssembly"
dependencies = [
  "pluot_core==0.1.19",
  "zarr>=3",
  "anywidget==0.11.0",
  "traitlets",
]

[project.urls]
repository = "https://github.com/keller-mark/pluot"
