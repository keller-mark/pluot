<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGPU Playground</title>
</head>
<body>
    <canvas id="coordinateCanvas" width="600" height="600" style="border: 1px solid black;"></canvas>
    <ul style="font-family: monospace;">
        <li style="color: rgb(64,64,64);">&#9632; Origin (0, 0, 0)</li>
        <li style="color: rgb(255,0,0);">&#9632; +X axis (1.5, 0, 0)</li>
        <li style="color: rgb(255,153,153);">&#9632; -X axis (-1.5, 0, 0)</li>
        <li style="color: rgb(0,179,0);">&#9632; +Y axis (0, 1.5, 0)</li>
        <li style="color: rgb(153,255,153);">&#9632; -Y axis (0, -1.5, 0)</li>
        <li style="color: rgb(0,0,255);">&#9632; +Z axis (0, 0, 1.5)</li>
        <li style="color: rgb(153,153,255);">&#9632; -Z axis (0, 0, -1.5)</li>
    </ul>
    <script type="module">
      // Reference: https://observablehq.com/@mourner/webgpu-boilerplate
      //
      // Mirrors the vertex/fragment logic of
      // crates/pluot_core/src/layers/shaders/point_3d_layer.wgsl (perspective
      // projection, camera_view, and w-scaled billboard offset for constant
      // on-screen point size), but with the X/Y/Z coordinates and per-point
      // color hardcoded as consts instead of coming from data textures, so
      // the coordinate system can be inspected without any Rust/CPU-side code.
        const canvas = document.getElementById('coordinateCanvas');
        const context = canvas.getContext('webgpu');

        const adapter = await navigator.gpu?.requestAdapter();
        const device = await adapter?.requestDevice();
        const format = navigator.gpu.getPreferredCanvasFormat();
        context.configure({ device, format });

        /* lang: glsl */
        const code = `
            struct VertexOut {
              @builtin(position) pos: vec4f,
              @location(0) corner: vec2f,
              @location(1) color: vec4f
            }
            struct FragmentOut {
              @location(0) color: vec4f
            }

            // 4 corners of a unit quad for triangle strip: (-1,-1), (1,-1), (-1,1), (1,1)
            const QUAD: array<vec2<f32>, 4> = array<vec2<f32>, 4>(
                vec2<f32>(-1.0, -1.0),
                vec2<f32>( 1.0, -1.0),
                vec2<f32>(-1.0,  1.0),
                vec2<f32>( 1.0,  1.0)
            );

            // Origin plus one tick in each direction along X, Y, and Z, using the
            // conventional axis colors (X: red, Y: green, Z: blue; the negative
            // direction of each axis uses a paler shade of the same color).
            const POINT_COORDS: array<vec3<f32>, 7> = array<vec3<f32>, 7>(
                vec3<f32>( 0.0,  0.0,  0.0), // Origin
                vec3<f32>( 1.0,  0.0,  0.0), // +X
                vec3<f32>(-1.0,  0.0,  0.0), // -X
                vec3<f32>( 0.0,  1.0,  0.0), // +Y
                vec3<f32>( 0.0, -1.0,  0.0), // -Y
                vec3<f32>( 0.0,  0.0,  1.0), // +Z
                vec3<f32>( 0.0,  0.0, -1.0)  // -Z
            );

            const POINT_COLORS: array<vec4<f32>, 7> = array<vec4<f32>, 7>(
                vec4<f32>(0.25, 0.25, 0.25, 1.0), // Origin (gray)
                vec4<f32>(1.0,  0.0,  0.0,  1.0), // +X (red)
                vec4<f32>(1.0,  0.6,  0.6,  1.0), // -X (pale red)
                vec4<f32>(0.0,  0.7,  0.0,  1.0), // +Y (green)
                vec4<f32>(0.6,  1.0,  0.6,  1.0), // -Y (pale green)
                vec4<f32>(0.0,  0.0,  1.0,  1.0), // +Z (blue)
                vec4<f32>(0.6,  0.6,  1.0,  1.0)  // -Z (pale blue)
            );

            // Camera view matrix: Translate(0, 0, -8) * RotateX(-20 deg) * RotateY(35 deg),
            // baked into a single literal matrix. point_3d_layer.wgsl's projection
            // matrix expects view-space -Z to point into the screen, so this both
            // pushes the whole scene in front of the camera and tilts it so all
            // three axes (which would otherwise overlap head-on) are visible at once.
            // In the real layer this comes from view_params.camera_view, usually
            // driven by an interactive orbit camera instead of a fixed literal.
            const CAMERA_VIEW: mat4x4<f32> = mat4x4<f32>(
              vec4<f32>( 1.0, 0.0, 0.0, 0.0),
              vec4<f32>( 0.0, 1.0, 0.0, 0.0),
              vec4<f32>( 0.0, 0.0, 1.0, 0.0),
              vec4<f32>( 0.0, 0.0, -3.0, 1.0)
            );

            const LAYER_SIZE: vec2<f32> = vec2<f32>(600.0, 600.0); // Canvas size in pixels
            const POINT_RADIUS: f32 = 10.0; // Point radius in pixels

            @vertex fn vertexMain(
              @builtin(instance_index) instance_index: u32,
              @builtin(vertex_index) vertex_index: u32
            ) -> VertexOut {
              // Point center in 3D data space.
              let p = POINT_COORDS[instance_index];

              // View aspect ratio
              let view_aspect_ratio = LAYER_SIZE.x / LAYER_SIZE.y;

              // 3D Perspective Projection Matrix
              // Using common defaults: fov = 45 degrees, near = 0.1, far = 100.0
              let fov_y = 0.785398; // 45 degrees in radians
              let f = 1.0 / tan(fov_y / 2.0);
              let near = 0.1;
              let far = 100.0;
              let nf = 1.0 / (near - far);

              let projection = mat4x4<f32>(
                  f / view_aspect_ratio, 0.0, 0.0, 0.0,
                  0.0, f, 0.0, 0.0,
                  0.0, 0.0, (far + near) * nf, -1.0,
                  0.0, 0.0, 2.0 * far * near * nf, 0.0
              );

              let model_view_projection = projection * CAMERA_VIEW;

              // Compute clip space position for the center of the point
              let clip_space_position = model_view_projection * vec4<f32>(p, 1.0);

              // Convert desired pixel radius to NDC
              let ndc_per_px = 2.0 / LAYER_SIZE;
              let radius_ndc = vec2<f32>(POINT_RADIUS * ndc_per_px.x, POINT_RADIUS * ndc_per_px.y);

              // Pick corner of quad and create offset in NDC space
              let corner = QUAD[vertex_index & 3u];
              let offset_ndc = corner * radius_ndc;

              var out: VertexOut;
              // The final position is the point's center in clip space, with an
              // offset applied in the XY plane. The offset is scaled by W so the
              // point has a constant size in screen space (billboarding).
              out.pos = vec4<f32>(
                  clip_space_position.xy + offset_ndc * clip_space_position.w,
                  clip_space_position.z,
                  clip_space_position.w
              );
              out.corner = corner;
              out.color = POINT_COLORS[instance_index];
              return out;
            }

            @fragment fn fragmentMain(v: VertexOut) -> FragmentOut {
              // Anti-aliased circle, matching point_3d_layer.wgsl's
              // point_shape_mode == 1 (Circle) branch, which is the default
              // PointShapeMode.
              let dist = length(v.corner);
              let edge_width = fwidth(dist);
              let alpha = 1.0 - smoothstep(1.0 - edge_width, 1.0 + edge_width, dist);
              if (alpha < 0.001) {
                discard;
              }

              var out: FragmentOut;
              out.color = vec4<f32>(v.color.rgb, alpha);
              return out;
            }
        `;

        const module = device.createShaderModule({code});
        const pipeline = device.createRenderPipeline({
          layout: 'auto',
          vertex: {
            module,
            entryPoint: 'vertexMain',
            buffers: [],
          },
          fragment: {
            module,
            entryPoint: 'fragmentMain',
            targets: [{
              format,
              blend: {
                color: {srcFactor: 'src-alpha', dstFactor: 'one-minus-src-alpha', operation: 'add'},
                alpha: {srcFactor: 'one', dstFactor: 'one-minus-src-alpha', operation: 'add'}
              }
            }]
          },
          primitive: {topology: 'triangle-strip'}
        });

        const encoder = device.createCommandEncoder();
        const output = {
            clearValue: [1, 1, 1, 1],
            loadOp: 'clear',
            storeOp: 'store',
            view: context.getCurrentTexture().createView()
        };
        const pass = encoder.beginRenderPass({colorAttachments: [output]});
        pass.setPipeline(pipeline);
        //pass.setVertexBuffer(0, vertexBuffer);
        //pass.setBindGroup(0, bindGroup);
        const numPoints = 7;
        // For each point, draw a quad (4 vertices).
        pass.draw(4, numPoints);
        pass.end();
        device.queue.submit([encoder.finish()]);

    </script>
</body>
</html>
