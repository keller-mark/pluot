[package]
name = "pluot_zarr"
description = "Format-specific Pluot layers for rendering Zarr data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"

exclude = ["tests"]
categories = []
keywords = []

[package.metadata.docs.rs]
# This controls parameters for building documentation via docs.rs.
# The container has a 6 GB limit, which happens while `pluot_core` is being compiled as a dependency of `pluot`
# `pluot_core` pulls in several memory-hungry deps for rustdoc:
# `wgpu`, `zarrs`, `image`, `fontdue`, `nalgebra-glm`, `kurbo`, `earcut`.

# rustdoc's parallel item-processing threads are the usual culprit.
# rustdoc parallelizes doc generation across threads; each thread holds
# full type/monomorphization info in memory. wgpu's generics make this expensive.
rustdoc-args = ["-Z", "threads=1"]

# Skip building docs for extra targets; only document the default one.
targets = []

[lib]
name = "pluot_zarr"
crate-type = ["lib"]

[lints]
workspace = true

[features]
default = []
# Define a feature for running unit tests in GPU-less environments
lacks_gpu = []


[dependencies]
pluot_core = { workspace = true }

inventory.workspace = true

glam.workspace = true
encase.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
svg.workspace = true
futures.workspace = true

# Note: zarrs is also specified in dev-dependencies,
# since its "filesystem" feature is used for unit tests.
zarrs = { workspace = true, default-features = false, features = [
    "ndarray",
    "crc32c",
    "gzip",
    "sharding",
    "transpose",
    "async",
    # "filesystem", # was working under zarrs_filesystem v0.3.8, stopped working in zarrs_filesystem v0.3.9
] }

# For OME-Zarr image metadata parsing.
# We use this fork which relaxes things by not using serde(deny_unknown_fields).
ome_zarr_metadata.workspace = true


[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Note zarrs is also used for core dependencies (but without its "filesystem" feature). "filesystem" is needed for unit tests.
zarrs = { workspace = true, default-features = false, features = [
    "ndarray",
    "crc32c",
    "gzip",
    "sharding",
    "transpose",
    "async",
    "filesystem",
] }

# We depend on tokio for the non-wasm unit tests that call async functions.
# Note: tokio is also used for the python feature (but without its "full" feature). "full" is needed for its async unit testing functionality.
tokio = { workspace = true, features = ["full"] }
