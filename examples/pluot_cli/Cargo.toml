[package]
name = "pluot_cli"
description = "Command-line interface for rendering visualizations with Pluot."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"

[[bin]]
name = "pluot_cli"
path = "src/main.rs"

[dependencies]
pluot = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
image = { workspace = true, default-features = false, features = ["bmp", "png"] }
resvg = { workspace = true }
tiny-skia = { workspace = true }
#kompari = { git = "https://github.com/linebender/kompari", rev = "63476ab" }

# For constructing real Zarr store instances (HttpStore/LocalStore) from the
# `stores` input, to pass to `render_with_stores` rather than relying on the
# global store registry / bound `zarr_*` functions used by the JS/Python bindings.
zarrs_storage = { version = "0.4", features = ["async"] }
zarrs_filesystem = "0.3"
zarrs_http = "0.3"
