name: Release and deploy

on:
  push:
    branches:
    - main

permissions:
  contents: read
  pages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare_docs_site:
    runs-on: ubuntu-latest
    permissions:
      # Need "write" to interact with GitHub's OIDC Token endpoint.
      id-token: write
      # Need "read" to interact with GitHub's OIDC Token endpoint. Need "write" to create release. Write also includes Read.
      contents: write
      pull-requests: write
    outputs:
      should-release: ${{ steps.changesets.outputs.should-release }}
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
        # Reference: https://github.com/changesets/changesets/issues/517#issuecomment-1182094769
        # ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@v2
    - name: For Rust - Install cargo-edit
      run: cargo install cargo-edit
    # Start WASM-specific stuff
    #- name: Install wasm-pack (alternative method)
    #  run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
    - name: For JS - Install wasm-pack
      uses: taiki-e/install-action@v2
      with:
        tool: wasm-pack
    - name: For JS - Install nightly wasm-bindgen CLI
      run: cargo install --git https://github.com/rustwasm/wasm-bindgen --rev b766ac3e206a8efab2c7cf91923cd502b2bc77a5 wasm-bindgen-cli
    #- uses: Swatinem/rust-cache@v2
    - name: For JS - Compile Rust code to WASM
      run: wasm-pack build crates/pluot --release --target web
    - uses: actions/setup-node@v6
      with:
        node-version: '24.x'
    # npm 11.5.1 or later is required for OIDC publishingso update to latest to be sure
    - run: npm install -g npm@latest
    - uses: pnpm/action-setup@v4
      name: Install pnpm
      id: pnpm-install
      with:
        run_install: true
    - name: For JS - Build and bundle the JS packages
      run: pnpm run build && pnpm run bundle

    - name: Create release pull request or Publish to NPM
      if: github.repository == 'keller-mark/pluot'
      id: changesets
      uses: changesets/action@v1
      with:
        title: Create release
        # this expects you to have a npm script called changeset-version that runs some logic and then calls `changeset version`.
        version: ./scripts/changeset-version.sh --action
        # This expects you to have a script called changeset-publish which does a build for the packages and calls `changeset publish`
        publish: ./scripts/changeset-publish.sh --action
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: For Python - Install UV
      if: steps.changesets.outputs.should-release == 'true'
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
    - name: For Python - Install dependencies
      if: steps.changesets.outputs.should-release == 'true'
      run: uv sync --extra dev
    - name: For Python - Build the package
      if: steps.changesets.outputs.should-release == 'true'
      run: uv run maturin build --release
    - name: For Python - Deploy package to PyPI
      if: steps.changesets.outputs.should-release == 'true'
      # continue-on-error: true
      uses: pypa/gh-action-pypi-publish@release/v1

    - id: get-tag
      run: echo "tag=v$(cat ./package.json | jq -r .version)" >> $GITHUB_OUTPUT
    - name: Create GitHub release if publish was successful
      if: steps.changesets.outputs.should-release == 'true'
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: ${{ steps.get-tag.outputs.tag }}
        body_path: RELEASE_NOTES.md
    - name: Build docs site
      if: steps.changesets.outputs.should-release == 'true'
      run: |
        # Note: Already ran `pnpm run build` above.
        pnpm run build-docs
        echo "pluot.dev" > bindings-js/docs/dist/CNAME

    - name: Upload docs site as pages artifact
      uses: actions/upload-pages-artifact@v3
      if: steps.changesets.outputs.should-release == 'true'
      with:
        path: ./bindings-js/docs/dist

  deploy_docs_site:
    runs-on: ubuntu-latest
    needs: prepare_docs_site
    if: needs.prepare_docs_site.outputs.should-release == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
