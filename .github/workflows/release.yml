name: Release and deploy

on:
  push:
    branches:
    - main

permissions:
  contents: read
  pages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare_docs_site:
    runs-on: ubuntu-latest
    permissions:
      # Need "write" to interact with GitHub's OIDC Token endpoint.
      id-token: write
      # Need "read" to interact with GitHub's OIDC Token endpoint. Need "write" to create release. Write also includes Read.
      contents: write
      pull-requests: write
    outputs:
      should-release: ${{ steps.changesets.outputs.should-release }}
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
        # Reference: https://github.com/changesets/changesets/issues/517#issuecomment-1182094769
        # ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@v2
    - name: For Rust - Install cargo-edit
      run: cargo install cargo-edit
    # Start WASM-specific stuff
    #- name: Install wasm-pack (alternative method)
    #  run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
    - name: For JS - Install wasm-pack
      uses: taiki-e/install-action@v2
      with:
        tool: wasm-pack
    - name: For JS - Install nightly wasm-bindgen CLI
      run: cargo install --git https://github.com/rustwasm/wasm-bindgen --rev b766ac3e206a8efab2c7cf91923cd502b2bc77a5 wasm-bindgen-cli
    #- uses: Swatinem/rust-cache@v2
    - name: For JS - Compile Rust code to WASM
      run: wasm-pack build crates/pluot --release --target web
    - uses: actions/setup-node@v6
      with:
        node-version: '24.x'
    # npm 11.5.1 or later is required for OIDC publishingso update to latest to be sure
    - run: npm install -g npm@latest
    - uses: pnpm/action-setup@v6
      name: Install pnpm
      id: pnpm-install
      with:
        run_install: true
    - name: For JS - Build and bundle the JS packages
      run: pnpm run build && pnpm run bundle

    - name: Create release pull request or Publish to NPM
      if: github.repository == 'keller-mark/pluot'
      id: changesets
      uses: changesets/action@v1
      with:
        title: Create release
        # this expects you to have a npm script called changeset-version that runs some logic and then calls `changeset version`.
        version: ./scripts/changeset-version.sh --action
        # This expects you to have a script called changeset-publish which does a build for the packages and calls `changeset publish`
        publish: ./scripts/changeset-publish.sh --action
      env:
        # Note: Must enable Workflow permissions - "Read and write permissions" and "Allow GitHub Actions to create and approve pull requests"
        # in the repo's Settings -> Actions -> General page.
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: For Rust - Authenticate with crates.io
      if: steps.changesets.outputs.should-release == 'true'
      uses: rust-lang/crates-io-auth-action@v1
      id: cratesioauth
    - name: For Rust - Publish to crates.io
      if: steps.changesets.outputs.should-release == 'true'
      run: cargo publish --workspace --allow-dirty
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.cratesioauth.outputs.token }}


    # Note: the python stuff is commented-out. Instead, we use the generated workflow in `publish-wheels.yml`.
    # That workflow will run whenever a new git tag is created, which occurs upon a new github release
    # by the below `softprops/action-gh-release` step.

    # - name: For Python - Install UV
    #   if: steps.changesets.outputs.should-release == 'true'
    #   uses: astral-sh/setup-uv@v3
    #   with:
    #     version: "latest"
    # - name: For Python - Install dependencies
    #   if: steps.changesets.outputs.should-release == 'true'
    #   run: uv sync --extra dev
    # - name: For Python - Build the package for multiple targets
    #   if: steps.changesets.outputs.should-release == 'true'
    #   uses: PyO3/maturin-action@v1
    #   with:
    #     command: build
    #     args: --release --out dist
    # - name: For Python - Deploy package to PyPI
    #   if: steps.changesets.outputs.should-release == 'true'
    #   run: uv publish

    - id: get-tag
      run: echo "tag=v$(cat ./package.json | jq -r .version)" >> $GITHUB_OUTPUT
    - name: Create GitHub release if publish was successful
      if: steps.changesets.outputs.should-release == 'true'
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: ${{ steps.get-tag.outputs.tag }}
        body_path: RELEASE_NOTES.md
    - name: Build docs site
      if: steps.changesets.outputs.should-release == 'true'
      run: |
        # Note: Already ran `pnpm run build` above.
        pnpm run build-docs
        echo "pluot.dev" > bindings-js/docs/dist/CNAME

    - name: Upload docs site as pages artifact
      uses: actions/upload-pages-artifact@v3
      if: steps.changesets.outputs.should-release == 'true'
      with:
        path: ./bindings-js/docs/dist

  deploy_docs_site:
    runs-on: ubuntu-latest
    needs: prepare_docs_site
    if: needs.prepare_docs_site.outputs.should-release == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


  # The contents that follow are mostly autogenerated by maturin v1.14.1
  # We inline the jobs from that autogenerated workflow into this file, so that we can depend on the `should-release` variable.
  # We cannot rely on a tag-based workflow trigger, since the tag is created by `softprops/action-gh-release`,
  # and github does not allow such tags to trigger another workflow.
  # Reference: https://github.com/softprops/action-gh-release#permissions
  # To update, run
  #
  #    maturin generate-ci github
  #
  # Also see:
  # - https://github.com/kylebarron/arro3/blob/main/.github/workflows/wheels.yml
  # - https://github.com/keller-mark/oxc-py/blob/main/.github/workflows/CI.yml

  build_wheels_linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
          - runner: ubuntu-22.04
            target: s390x
          - runner: ubuntu-22.04
            target: ppc64le
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          # We need to specify a more modern manylinux version to fix
          # this error: snappy_src@0.2.5+snappy.1.2.2: armv7-unknown-linux-gnueabihf-g++: error: unrecognized command line option '-std=c++14'
          # The maturin action uses ghcr.io/rust-cross/manylinux2014-cross which predates the `-std=c++14` flag and fails building snappy_src's C++ sources.
          # manylinux_2_28-cross ships a modern-enough GCC for those two targets.
          manylinux: 2_28
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  build_wheels_musllinux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  build_wheels_windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            python_arch: x64
          - runner: windows-latest
            target: x86
            python_arch: x86
          - runner: windows-11-arm
            target: aarch64
            python_arch: arm64
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  build_wheels_macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  build_wheels_sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  publish_wheels:
    name: Release
    runs-on: ubuntu-latest
    if: needs.prepare_docs_site.outputs.should-release == 'true'
    needs: [prepare_docs_site, build_wheels_linux, build_wheels_musllinux, build_wheels_windows, build_wheels_macos, build_wheels_sdist]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: 'wheels-*/*'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always 'wheels-*/*'
